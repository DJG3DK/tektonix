# Dependency updates arrive as pull requests, weekly, grouped so one PR
# moves the LangChain family together (they version in step). Majors of
# development-only packages and the Actions are grouped too: on the first
# run each of those opened its own PR, fourteen at once (2026-09-29).
#
# Every manifest in the tree is here. Three were missing until 2026-09-29
# -- the review dashboard's npm, the router's pip and the images' base
# tags -- so the router's requirements floated unpinned and unwatched.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      langchain:
        patterns: ["langchain*", "langgraph*", "deepagents"]
      python-minor:
        update-types: ["minor", "patch"]
    # Majors that need a migration, not a bump (2026-10-01): pydantic-core
    # is pinned to what pydantic requires and moves with it; anthropic 1.x
    # moves with langchain-anthropic after a test pass.
    ignore:
      - dependency-name: "pydantic-core"
      - dependency-name: "anthropic"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /services/model-router
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      router:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: ["minor", "patch"]
      frontend-dev-major:
        dependency-type: development
        update-types: ["major"]
  - package-ecosystem: npm
    directory: /services/agent-review
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      agent-review:
        patterns: ["*"]
    # Express 5 changes route matching; an upgrade with its own test pass.
    ignore:
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  # The landing page and its newsletter signup, built and tested by CI's
  # `site` job and shipped with nothing.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      site:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /site/server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
  # The images' FROM lines and the compose file's third-party images
  # (postgres, redis). One PR for all of them.
  - package-ecosystem: docker
    directories: ["/docker/*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ["*"]
    # A new Python or Node major in the images changes the runtime projects'
    # checks run on: deliberate, with its own test pass (2026-10-01).
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # A Postgres major needs a dump and restore of an existing volume.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
