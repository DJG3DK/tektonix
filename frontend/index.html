<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover (audit M-21): without it env(safe-area-inset-*) is
         always 0 on iOS, making every --safe-* padding in the CSS inert. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Link preview (Open Graph). Absolute URLs: a crawler has no page context
         to resolve a relative one. The description says the dashboard is private
         and points at the repo, so nobody clicks through expecting to get in.

         noindex was removed 2026-08-29: a signed-out visitor now gets a real
         landing page rather than a password box, so there is a public page here
         to index. (It only ever suppressed search listings — preview crawlers
         don't read robots directives, so link previews were never affected.)

         meta description, because that is the line a search result actually
         shows; og:description is for social cards and is not a substitute.

         canonical, because the SPA fallback answers 200 with this same shell for
         every path under /v2/. Without it a crawler can index an unbounded set
         of URLs that are all in fact this one page. -->
    <meta name="description" content="An autonomous coding agent that plans, writes and verifies real changes against your own repositories — running the project's real test suite and passing an independent review gate before anything merges. Source available." />
    <link rel="canonical" href="https://tektonix.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tektonix" />
    <meta property="og:title" content="Tektonix — autonomous coding agent" />
    <meta property="og:description" content="Takes a plain-English goal, plans the work, writes the code, re-runs the project's real test suite, and ships it. Nothing merges on the agent's say-so: a second model reviews every diff in an isolated worktree first." />
    <!-- og:image was missing until now, so the card rendered as a
         summary_large_image with no image — a blank slab. The URL carries the
         /v2/ prefix because nginx 302s the site root into /v2/, and a crawler
         following a redirect for the image is not guaranteed to keep it. -->
    <meta property="og:url" content="https://tektonix.io/" />
    <meta property="og:image" content="https://tektonix.io/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tektonix — autonomous coding agent. Plan, Build, Verify, Review gate, Ship." />
    <meta name="twitter:image" content="https://tektonix.io/og-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tektonix — autonomous coding agent" />
    <meta name="twitter:description" content="Plans, writes, tests and ships code to real repos — with an independent review gate before anything merges." />
    <!-- RELATIVE hrefs on purpose: this app is
         served under /v2/ behind nginx, and a root-absolute /favicon.ico gets
         302-redirected to /v2/ and comes back as HTML. Relative resolves to
         /v2/favicon.ico, which the backend serves from dist/. No SVG icon —
         the hand-drawn cube SVG is illegible at 16px (it shipped as mush on
         the demo site until replaced with these hand-tuned PNGs). -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <!-- Was "Agent". There is a public landing page in front of the login now,
         so the tab title is the first thing a visitor reads, not just a label
         on an operator's pinned tab. Matches og:title. -->
    <title>Tektonix — autonomous coding agent</title>
    <!-- Structured data. Static in the HTML head on purpose: the page is a
         React SPA, and a crawler that does not execute JavaScript sees only
         this shell — anything the app injects after hydration may never be
         read. Claims here are limited to what the page itself states, because
         schema.org markup that overstates is worse than none. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Tektonix",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Linux, or any host running Docker",
        "url": "https://tektonix.io/",
        "description": "An autonomous coding agent that takes a plain-English goal, plans the work, writes the code, re-runs the project's real test suite, and ships it — with an independent review gate that must pass before anything merges.",
        "codeRepository": "https://github.com/DJG3DK/tektonix",
        "license": "https://polyformproject.org/licenses/noncommercial/1.0.0/",
        "isAccessibleForFree": true,
        "screenshot": "https://tektonix.io/og-preview.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
