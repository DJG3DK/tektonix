# The Tektonix bundle: one command, any host with Docker.
#
#   cp docker/.env.example .env   # set OPENROUTER_API_KEY and PROJECTS_DIR
#   docker compose up -d
#   open http://localhost:8100
#
# See docs/roadmap-packaging.md for why this exists and what it does not cover
# yet (a GitHub-only project is cloned onto this machine; there is no remote
# execution).

# The compose project name: every container, network and volume is
# tektonix-<service>-1, tektonix_checks, tektonix_pgdata. An install made
# before 2026-09-28 was three-d-agent; keep its data by putting
# COMPOSE_PROJECT_NAME=three-d-agent and POSTGRES_DB=three_d_agent in .env.
name: tektonix

services:
  postgres:
    image: postgres:16-alpine
    # First, so the generated secrets exist before any service that reads
    # them starts: everything else waits for this one to be healthy. See
    # docker/postgres/init-secrets.sh.
    entrypoint: ["/bin/sh", "/tektonix/init-secrets.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: agent
      # Blank means "generate one". The old compose defaults (`agent`,
      # `sk-local-dev`) were the same in every installation.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      MODEL_ROUTER_KEY: ${MODEL_ROUTER_KEY:-}
      POSTGRES_DB: ${POSTGRES_DB:-tektonix}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - bundlesecrets:/run/tektonix-secrets
      - ./docker/postgres/init-secrets.sh:/tektonix/init-secrets.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d ${POSTGRES_DB:-tektonix}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  router:
    build:
      context: .
      dockerfile: docker/router/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      MODEL_ROUTER_KEY_FILE: /run/tektonix-secrets/model_router_key
    # Image HEALTHCHECK already probes /health/liveliness. Named here so the
    # agent's depends_on can wait on it: a first task that starts while the
    # router is still booting dies mid-call with "peer closed connection".
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4001/health/liveliness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      # The operator's own pins when they have them, the committed example when
      # they do not. This was an unconditional mount of config.yaml, which is
      # gitignored and therefore absent from every fresh clone and every
      # release tarball -- Docker then creates a DIRECTORY at the missing
      # source and the router dies on "are you trying to mount a directory
      # onto a file". `docker compose up` in a fresh tree could not start.
      # Pointing the default at a file that is always there fixes it; set
      # ROUTER_CONFIG in .env to use your own.
      - ${ROUTER_CONFIG:-./services/model-router/config.example.yaml}:/app/config.yaml:ro
      - routerlogs:/app/logs
      - bundlesecrets:/run/tektonix-secrets:ro
    restart: unless-stopped

  # The sandbox image every task and check runs in. Built here, with
  # compose's own progress on screen, before the agent starts. It used to be
  # built by the agent's entrypoint on first run, inside the agent's health
  # window: on a slow first download the agent was declared unhealthy before
  # it had started serving, and the whole stack failed (2026-09-28). The
  # container itself does nothing and exits at once; the image is the point.
  sandbox-image:
    image: tektonix-sandbox:latest
    build:
      context: ./docker/agent-sandbox
    entrypoint: ["true"]
    restart: "no"

  agent:
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      router:
        condition: service_healthy
      checks-postgres:
        condition: service_healthy
      checks-redis:
        condition: service_started
    environment:
      # The entrypoint builds LANGGRAPH_PG_DSN and MODEL_ROUTER_KEY from these
      # generated files; set LANGGRAPH_PG_DSN yourself to use another database.
      POSTGRES_PASSWORD_FILE: /run/tektonix-secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-tektonix}
      MODEL_ROUTER_KEY_FILE: /run/tektonix-secrets/model_router_key
      MODEL_ROUTER_URL: http://router:4001
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      DEFAULT_BUDGET_USD: ${DEFAULT_BUDGET_USD:-2.00}
      # Required by agent/config.py, and empty is a valid answer: without SMTP
      # a password reset is done against the database instead (INSTALL.md 6a).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # THE line that makes sibling containers work. The agent sees projects at
      # /projects; the host daemon, which actually resolves every bind mount,
      # sees them at PROJECTS_DIR. Without this the sandbox would mount empty
      # directories and every task would read an empty repo -- silently.
      # See agent/tools/sandbox.py's host_path().
      AGENT_HOST_PATH_MAP: /projects=${PROJECTS_DIR:?set PROJECTS_DIR in .env}
      # Shared with the two review containers, which read the same file.
      AGENT_PROJECTS_JSON: /app/data/projects.json
      # Worktrees must live somewhere AGENT_HOST_PATH_MAP can translate, or
      # the sandbox asks the host daemon to mount a path that exists only
      # inside this container -- which succeeds, empty, and silently. The
      # default (/home/agent-workspaces) is exactly that. Under /projects it
      # is covered by the mapping already there, and nothing scans this root,
      # so a dot-directory stays out of the way.
      AGENT_SANDBOX_ROOT: /projects/.tektonix-workspaces
      # The commit reviewer's worktrees, which it asks this service to run
      # checks in (agent/review_sandbox.py). Under /projects for the same
      # reason as the workspaces above, and the same value the reviewer uses:
      # a request naming a worktree anywhere else is refused. Setting it is
      # also what enables that endpoint at all.
      REVIEW_WORKTREE_ROOT: /projects/.tektonix-review-worktrees
      # A project's db:drift, db:seed and test:e2e run in the checks
      # container on the private `checks` network, against the two throwaway
      # services below (agent/review_sandbox.py). The network is internal and
      # this service is NOT on it: a check can reach the two of them and
      # nothing else, and the agent sets each run up with `docker exec` into
      # the two containers (their names, and the URLs as a check sees them;
      # no password -- each run gets its own plain role). All five unset
      # means the reviewer refuses the database checks, as it did before
      # 2026-09-27.
      REVIEW_CHECKS_NETWORK: tektonix_checks
      REVIEW_CHECKS_POSTGRES_URL: postgresql://checks@checks-postgres:5432/postgres
      REVIEW_CHECKS_REDIS_URL: redis://checks-redis:6379
      REVIEW_CHECKS_POSTGRES_CONTAINER: tektonix-checks-postgres
      REVIEW_CHECKS_REDIS_CONTAINER: tektonix-checks-redis
      # The review services are siblings here, not localhost.
      REVIEW_SERVICE_HOST: agent-review
      REVIEW_CONTROL_HOST: commit-reviewer
    volumes:
      # Sibling containers, not nested. See docker/agent/Dockerfile.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECTS_DIR:?set PROJECTS_DIR in .env}:/projects
      - agentdata:/app/data
      - agentlogs:/app/logs
      - bundlesecrets:/run/tektonix-secrets:ro
      # The sandbox image is built on first run from this context.
      - ./docker/agent-sandbox:/app/docker/agent-sandbox:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${AGENT_PORT:-8100}:8100"
    restart: unless-stopped

  # The review gate. This is the part that makes a merge mean something: one
  # model writes the code, a second reviews the branch, and only a READY
  # verdict merges. Leaving it out of the bundle meant the easiest install
  # produced an agent with no gate -- which is most of the product.
  #
  # The one thing that does NOT work here is deploying after a merge: pm2
  # runs on the host and a container cannot reach it. That endpoint says so
  # rather than failing (TEKTONIX_BUNDLE, services/agent-review/server.js).
  agent-review:
    build:
      context: .
      dockerfile: docker/reviewer/Dockerfile
    depends_on:
      agent:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4100/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    environment:
      AGENT_HOME: /app
      AGENT_PROJECTS_JSON: /app/data/projects.json
      REVIEW_STATE_DIR: /app/review-state
      # Written by the agent's entrypoint into the shared data volume on first
      # run, so all three containers agree without it being in compose or in
      # anyone's shell history.
      REVIEW_CONTROL_SECRET_FILE: /app/data/review_control_secret
      MODEL_ROUTER_URL: http://router:4001
      REVIEW_CONTROL_HOST: commit-reviewer
      TEKTONIX_BUNDLE: "1"
    volumes:
      - ${PROJECTS_DIR:?set PROJECTS_DIR in .env}:/projects
      - agentdata:/app/data:ro
      - reviewstate:/app/review-state
    restart: unless-stopped

  commit-reviewer:
    build:
      context: .
      dockerfile: docker/reviewer/Dockerfile
    command: ["node", "services/commit-reviewer/reviewer.js"]
    depends_on:
      agent:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4101/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    environment:
      AGENT_HOME: /app
      AGENT_PROJECTS_JSON: /app/data/projects.json
      REVIEW_STATE_DIR: /app/review-state
      REVIEW_CONTROL_SECRET_FILE: /app/data/review_control_secret
      # The reviewer's own model call goes through the router like every other
      # call, so its choice and its spend are visible in one place.
      MODEL_ROUTER_URL: http://router:4001/v1
      MODEL_ROUTER_KEY_FILE: /run/tektonix-secrets/model_router_key
      TEKTONIX_BUNDLE: "1"
      # Checks run agent-authored code, and THIS container holds the secret
      # that authorises a merge -- so they never run here. The agent, which
      # has the docker socket, starts a sandbox container for each one
      # (services/commit-reviewer/sandbox.js), after a probe that the image is
      # there; the agent builds it on demand. Unset, every check refuses.
      AGENT_SANDBOX_URL: http://agent:8100
      # Under /projects so the agent can hand it to the host daemon, and the
      # same value the agent validates against.
      REVIEW_WORKTREE_ROOT: /projects/.tektonix-review-worktrees
    volumes:
      - ${PROJECTS_DIR:?set PROJECTS_DIR in .env}:/projects
      - agentdata:/app/data:ro
      - reviewstate:/app/review-state
      - bundlesecrets:/run/tektonix-secrets:ro
    restart: unless-stopped

  # The database checks' own Postgres and Redis: throwaway, on the internal
  # `checks` network only, where the only other thing is the check container
  # of a review in flight. The agent is not on the network; it creates and
  # drops each review's role and database with `docker exec` into these
  # containers (fixed names, so it can). Data lives in memory; nothing here
  # outlives a restart, and nothing here is yours. The bootstrap password is
  # replaced with one nobody holds the moment the server is up
  # (docker/checks-postgres/init.sh): a check gets its own plain role, not
  # the superuser.
  checks-postgres:
    image: postgres:16-alpine
    container_name: tektonix-checks-postgres
    environment:
      POSTGRES_USER: checks
      POSTGRES_PASSWORD: checks
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/checks-postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - checks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checks -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  checks-redis:
    image: redis:7-alpine
    container_name: tektonix-checks-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - checks
    restart: unless-stopped

networks:
  default:
  # No gateway: a container on this network alone cannot reach the internet,
  # the host, or any service that is not also on it.
  checks:
    internal: true

volumes:
  pgdata:
  # Verdicts and their history. Separate from agentdata because the agent owns
  # that one and these two write this one.
  reviewstate:
  # The generated database password and router key. Written by postgres's
  # entrypoint wrapper, read-only everywhere else.
  bundlesecrets:
  agentdata:
  agentlogs:
  routerlogs:
