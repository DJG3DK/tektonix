id: py-midnight-orders
fixture: pyservice
category: investigation
budget_usd: 2.5
goal: |
  Shops outside UTC are getting the wrong orders in their daily report. A shop
  in New York (UTC-5) says an order its customer placed at 9pm on 1 March
  shows up on the 2 March report instead.

  Find the cause and fix it, add a test that reproduces the report, and make
  sure a UTC shop's report does not change.
assert:
  - checks_pass: true
  - command:
      - python3
      - -c
      - |
        import sys; sys.path.insert(0, '.')
        from datetime import date
        from src.orders import orders_on
        orders = [{'id': 1, 'placed_at': '2026-03-02T02:00:00+00:00'},
                  {'id': 2, 'placed_at': '2026-03-02T06:00:00+00:00'},
                  {'id': 3, 'placed_at': '2026-03-01T21:30:00-05:00'}]
        ids = lambda d, off: [o['id'] for o in orders_on(orders, d, off)]
        assert ids(date(2026, 3, 1), -5) == [1, 3], ids(date(2026, 3, 1), -5)
        assert ids(date(2026, 3, 2), -5) == [2]
        assert ids(date(2026, 3, 2), 0) == [1, 2, 3]
  - diff_touches: ["src/orders.py", "tests/**"]
